[package]
name = "zkmc"
version = "0.3.1"
edition = "2021"

[dependencies]
# Prepared by scripts/setup_sonobe_offchain.sh.
folding-schemes = { path = ".vendor/sonobe/folding-schemes" }

ark-crypto-primitives = {
    version = "^0.5.0",
    default-features = false,
    features = ["std", "constraints", "sponge"]
}
ark-ff = { version = "^0.5.0", default-features = false }
ark-groth16 = { version = "^0.5.0" }

ark-mnt4-298 = {
    version = "^0.5.0",
    default-features = false,
    features = ["curve", "r1cs"]
}
ark-mnt6-298 = {
    version = "^0.5.0",
    default-features = false,
    features = ["r1cs"]
}

ark-r1cs-std = { version = "^0.5.0", default-features = false }
ark-relations = { version = "^0.5.0", default-features = false }
ark-serialize = { version = "^0.5.0", default-features = false }
ark-snark = { version = "^0.5.0", default-features = false }
ark-std = { version = "^0.5.0", default-features = false }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[patch.crates-io]
ark-bn254 = {
    git = "https://github.com/dmpierre/algebra.git",
    branch = "fix/wasm32"
}
