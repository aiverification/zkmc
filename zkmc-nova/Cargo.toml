[package]
name = "zkmc"
version = "0.2.0"
edition = "2021"

[dependencies]
folding-schemes = { git = "https://github.com/privacy-scaling-explorations/sonobe", rev = "9b7dd34", package = "folding-schemes" }

ark-bn254 = { version = "^0.5.0", default-features = false, features = ["r1cs"] }
ark-grumpkin = { version = "^0.5.0", default-features = false, features = ["r1cs"] }
ark-ff = { version = "^0.5.0", default-features = false }
ark-r1cs-std = { version = "^0.5.0", default-features = false }
ark-relations = { version = "^0.5.0", default-features = false }
ark-std = { version = "^0.5.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[patch.crates-io]
ark-bn254 = { git = "https://github.com/dmpierre/algebra.git", branch = "fix/wasm32" }
ark-grumpkin = { git = "https://github.com/dmpierre/algebra.git", branch = "fix/wasm32" }
ark-ec = { git = "https://github.com/dmpierre/algebra.git", branch = "fix/wasm32" }
ark-ff = { git = "https://github.com/dmpierre/algebra.git", branch = "fix/wasm32" }
ark-poly = { git = "https://github.com/dmpierre/algebra.git", branch = "fix/wasm32" }
ark-serialize = { git = "https://github.com/dmpierre/algebra.git", branch = "fix/wasm32" }

ark-r1cs-std = { git = "https://github.com/flyingnobita/r1cs-std_yelhousni", rev = "b4bab0c" }
ark-relations = { git = "https://github.com/arkworks-rs/snark" }
ark-snark = { git = "https://github.com/arkworks-rs/snark" }
ark-crypto-primitives = { git = "https://github.com/flyingnobita/crypto-primitives", rev = "f559264" }
ark-std = { git = "https://github.com/arkworks-rs/std" }
ark-poly-commit = { git = "https://github.com/arkworks-rs/poly-commit" }
ark-groth16 = { git = "https://github.com/arkworks-rs/groth16", rev = "b3b4a15" }

[patch."https://github.com/arkworks-rs/algebra"]
ark-ec = { git = "https://github.com/dmpierre/algebra.git", branch = "fix/wasm32" }
ark-ff = { git = "https://github.com/dmpierre/algebra.git", branch = "fix/wasm32" }
ark-poly = { git = "https://github.com/dmpierre/algebra.git", branch = "fix/wasm32" }
ark-serialize = { git = "https://github.com/dmpierre/algebra.git", branch = "fix/wasm32" }

[patch."https://github.com/arkworks-rs/crypto-primitives.git"]
ark-crypto-primitives = { git = "https://github.com/flyingnobita/crypto-primitives", rev = "f559264" }
