[package]
name = "zkmc-symbolic-folding"
version = "0.1.0"
edition = "2024"

[dependencies]
zkmatrix = { git = "https://github.com/y1izwnxt0m4dows6/zkMatrix", branch = "master" }
bls12_381 = { git = "https://github.com/y1izwnxt0m4dows6/bls12_381", branch = "pub_g1" }
ark-ff = "0.4.0"
ark-std = "0.4.0"
rand = "0.8"
bls_bulletproofs = { git = "https://github.com/y1izwnxt0m4dows6/bls_bulletproofs", branch = "msm-patch" }
blstrs = "0.6.1"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
group = "0.12.0"
merlin = { version = "3", default-features = false }
rayon = "1.11.0"
criterion = "0.5"
# Same major version as zkmatrix, so `TranSeq::hasher` can be fed directly.
sha2 = "0.10.8"

[[bench]]
name = "prove_and_verify_full"
harness = false

[patch.crates-io]
curv-kzen = { git = "https://github.com/y1izwnxt0m4dows6/curv", branch = "fix-div-ceil" }
