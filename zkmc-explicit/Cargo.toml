[package]
name = "zkmc-explicit"
version = "0.1.0"
edition = "2024"

[dependencies]
ark-bls12-381 = { version = "0.5.0", features = ["curve"] }
ark-ec = { version = "0.5.0", features = ["parallel"] }
ark-ff = { version = "0.5.0", features = ["parallel", "asm"] }
ark-poly = { version = "0.5.0", features = ["parallel"] }
ark-poly-commit = { version = "0.5.0", features = ["parallel"] }
ark-std = { version = "0.5.0", features = ["parallel"] }
rand = {version = "0.8.5", features = ["std", "std_rng"]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "benchmark_full_parallel"
harness = false
